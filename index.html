<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journey By Mitu — Bus Ticket Booking</title>
<style>
  :root{
    --navy:#16264a;
    --navy-deep:#0d1830;
    --paper:#f4f1ea;
    --card:#ffffff;
    --amber:#e39a3c;
    --amber-deep:#c17f26;
    --ink:#232735;
    --muted:#6b7280;
    --line:#dcdccd;
    --seat-free:#eef0e8;
    --seat-taken:#c9ccd6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  a{color:inherit; text-decoration:none;}
  .hidden{display:none !important;}

  header{
    background:var(--navy);
    color:#fff;
    padding:18px 5vw;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .brand{font-size:1.3rem; font-weight:700; letter-spacing:.2px;}
  .brand span{color:var(--amber);}
  .step-indicator{font-size:.85rem; color:#aab3cc;}

  main{max-width:820px; margin:0 auto; padding:36px 5vw 70px;}

  /* ---- SEARCH PANEL ---- */
  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:26px 24px;
  }
  .panel h1{font-size:1.4rem; margin-bottom:18px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px 16px;}
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:14px;}
  .field label{font-size:.72rem; font-weight:600; text-transform:uppercase; color:var(--muted); letter-spacing:.4px;}
  select, input{
    border:1px solid var(--line);
    border-radius:5px;
    padding:10px 11px;
    font-size:.95rem;
    background:#fbfbf8;
    font-family:inherit;
    color:var(--ink);
  }
  select:focus, input:focus{outline:2px solid var(--amber); outline-offset:1px;}
  .swap{display:flex; align-items:center; gap:8px; grid-column:1/-1; margin:-6px 0 4px;}
  .swap button{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--line);
    background:#fff; cursor:pointer; font-size:.9rem;
  }
  .swap span{font-size:.78rem; color:var(--muted);}
  .btn{
    display:inline-block; border:none; border-radius:5px; padding:12px 20px;
    background:var(--amber); color:var(--navy-deep); font-weight:700; font-size:.95rem;
    cursor:pointer; transition:background .15s;
  }
  .btn:hover{background:var(--amber-deep); color:#fff;}
  .btn.wide{width:100%; margin-top:6px;}
  .btn.ghost{background:none; border:1px solid var(--line); color:var(--ink); font-weight:600;}

  .routes{margin-top:30px;}
  .routes h2{font-size:1.05rem; margin-bottom:12px; color:var(--navy);}
  .route-list{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .route-card{
    background:var(--card); border:1px solid var(--line); border-radius:6px;
    padding:12px 14px; cursor:pointer; transition:transform .12s, box-shadow .12s;
    font-size:.9rem;
  }
  .route-card:hover{transform:translateY(-2px); box-shadow:0 8px 18px rgba(22,38,74,.1);}
  .route-card b{color:var(--navy);}
  .route-card .price{float:right; color:var(--amber-deep); font-weight:700;}

  /* ---- BUS LIST ---- */
  .bus-card{
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:18px 20px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; gap:16px;
  }
  .bus-card .op{font-weight:700; font-size:1.02rem;}
  .bus-card .meta{color:var(--muted); font-size:.85rem; margin-top:4px;}
  .bus-card .fare{font-size:1.2rem; font-weight:700; color:var(--navy); white-space:nowrap;}
  .bus-card .seats-left{font-size:.78rem; color:var(--amber-deep); margin-top:3px;}

  /* ---- SEAT MAP ---- */
  .seat-map{display:grid; grid-template-columns:repeat(5, 40px); gap:8px; justify-content:center; margin:24px 0;}
  .seat{
    width:44px; height:44px; border-radius:6px; border:1px solid var(--line);
    background:var(--seat-free); display:flex; align-items:center; justify-content:center;
    font-size:.75rem; cursor:pointer; color:var(--muted);
  }
  .seat.aisle-gap{background:none; border:none; cursor:default;}
  .seat.taken{background:var(--seat-taken); color:#8a8f9c; cursor:not-allowed;}
  .seat.selected{background:var(--amber); color:#fff; border-color:var(--amber-deep);}
  .legend{display:flex; gap:18px; justify-content:center; font-size:.78rem; color:var(--muted); margin-bottom:6px;}
  .legend .dot{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:middle;}

  .summary{
    background:var(--card); border:1px solid var(--line); border-radius:8px; padding:18px 20px; margin-top:20px;
  }
  .summary-row{display:flex; justify-content:space-between; font-size:.9rem; padding:6px 0; border-bottom:1px solid var(--line);}
  .summary-row:last-child{border:none; font-weight:700; font-size:1rem; padding-top:10px;}

  /* ---- TICKET ---- */
  .ticket{
    background:var(--navy); color:#fff; border-radius:10px; padding:28px 26px; position:relative; overflow:hidden;
  }
  .ticket::after{
    content:""; position:absolute; right:-14px; top:50%; transform:translateY(-50%);
    width:28px; height:28px; background:var(--paper); border-radius:50%;
  }
  .ticket::before{
    content:""; position:absolute; left:-14px; top:50%; transform:translateY(-50%);
    width:28px; height:28px; background:var(--paper); border-radius:50%;
  }
  .ticket h2{font-size:1.2rem; margin-bottom:4px;}
  .ticket .pnr{color:var(--amber); font-weight:700; letter-spacing:1px; margin-bottom:18px; font-size:.9rem;}
  .ticket-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 20px; font-size:.88rem;}
  .ticket-grid .label{color:#aab3cc; font-size:.72rem; text-transform:uppercase; letter-spacing:.4px; margin-bottom:2px;}

  footer{text-align:center; padding:24px; color:var(--muted); font-size:.8rem;}

  @media (max-width:560px){
    .route-list{grid-template-columns:1fr;}
    .grid2{grid-template-columns:1fr;}
    .bus-card{flex-direction:column; align-items:flex-start;}
    .ticket-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">Journey By <span>Mitu</span></div>
  <div class="step-indicator" id="stepIndicator">Search</div>
</header>

<main>

  <!-- STEP 1: SEARCH -->
  <section id="screen-search" class="screen">
    <div class="panel">
      <h1>Book your bus ticket</h1>
      <form id="searchForm">
        <div class="grid2">
          <div class="field">
            <label for="from">From</label>
            <select id="from">
              <option>Dhaka</option><option>Rangpur</option><option>Chattogram</option>
              <option>Sylhet</option><option>Khulna</option><option>Rajshahi</option><option>Bogura</option>
            </select>
          </div>
          <div class="field">
            <label for="to">To</label>
            <select id="to">
              <option>Rangpur</option><option>Dhaka</option><option>Chattogram</option>
              <option>Sylhet</option><option>Khulna</option><option>Rajshahi</option><option>Bogura</option>
            </select>
          </div>
          <div class="swap">
            <button type="button" id="swapBtn" title="Swap">⇅</button>
            <span>Swap origin and destination</span>
          </div>
          <div class="field">
            <label for="date">Departure date</label>
            <input type="date" id="date">
          </div>
          <div class="field">
            <label for="pax">Passengers</label>
            <select id="pax"><option>1</option><option>2</option><option>3</option><option>4</option></select>
          </div>
        </div>
        <button type="submit" class="btn wide">Search buses</button>
      </form>
    </div>

    <div class="routes">
      <h2>Popular routes</h2>
      <div class="route-list" id="routeList"></div>
    </div>
  </section>

  <!-- STEP 2: BUS RESULTS -->
  <section id="screen-results" class="screen hidden">
    <button class="btn ghost" id="backToSearch">&larr; Edit search</button>
    <h1 id="resultsTitle" style="margin:16px 0 18px; font-size:1.25rem;"></h1>
    <div id="busList"></div>
  </section>

  <!-- STEP 3: SEAT SELECTION -->
  <section id="screen-seats" class="screen hidden">
    <button class="btn ghost" id="backToResults">&larr; Change bus</button>
    <h1 id="seatsTitle" style="margin:16px 0 6px; font-size:1.25rem;"></h1>
    <p id="seatsSub" style="color:var(--muted); font-size:.88rem; margin-bottom:10px;"></p>

    <div class="legend">
      <span><span class="dot" style="background:var(--seat-free)"></span>Available</span>
      <span><span class="dot" style="background:var(--amber)"></span>Selected</span>
      <span><span class="dot" style="background:var(--seat-taken)"></span>Booked</span>
    </div>
    <div class="seat-map" id="seatMap"></div>

    <div class="summary" id="seatSummary"></div>
    <button class="btn wide" id="toPassenger" style="margin-top:16px;">Continue</button>
  </section>

  <!-- STEP 4: PASSENGER DETAILS -->
  <section id="screen-passenger" class="screen hidden">
    <button class="btn ghost" id="backToSeats">&larr; Change seats</button>
    <h1 style="margin:16px 0 18px; font-size:1.25rem;">Passenger details</h1>
    <div class="panel">
      <form id="passengerForm">
        <div class="field">
          <label for="pname">Full name</label>
          <input type="text" id="pname" required placeholder="e.g. Mitu Rahman">
        </div>
        <div class="field">
          <label for="pphone">Phone number</label>
          <input type="tel" id="pphone" required placeholder="01XXXXXXXXX">
        </div>
        <div class="field">
          <label for="pemail">Email (optional)</label>
          <input type="email" id="pemail" placeholder="you@example.com">
        </div>
        <button type="submit" class="btn wide">Confirm booking</button>
      </form>
    </div>
  </section>

  <!-- STEP 5: TICKET -->
  <section id="screen-ticket" class="screen hidden">
    <div class="ticket">
      <h2>Booking confirmed</h2>
      <div class="pnr" id="pnrCode"></div>
      <div class="ticket-grid" id="ticketGrid"></div>
    </div>
    <button class="btn wide" id="newBooking" style="margin-top:20px;">Book another ticket</button>
  </section>

</main>

<footer>Journey By Mitu — a demo booking interface. No real payments are processed.</footer>

<script>
(function(){
  const CITIES = ["Dhaka","Rangpur","Chattogram","Sylhet","Khulna","Rajshahi","Bogura"];
  const OPERATORS = ["Green Line Paribahan","Shyamoli NR","Hanif Enterprise","Ena Transport","Desh Travels"];

  const POPULAR_ROUTES = [
    {from:"Dhaka", to:"Rangpur", dur:"7h 30m", price:650},
    {from:"Dhaka", to:"Chattogram", dur:"5h 45m", price:580},
    {from:"Dhaka", to:"Sylhet", dur:"5h 10m", price:520},
    {from:"Rangpur", to:"Dhaka", dur:"7h 30m", price:650},
    {from:"Dhaka", to:"Khulna", dur:"5h 00m", price:500},
    {from:"Dhaka", to:"Rajshahi", dur:"6h 20m", price:560},
  ];

  const state = { from:"Dhaka", to:"Rangpur", date:"", pax:1, buses:[], chosenBus:null, seats:[], fare:0 };

  // seeded-ish random so a given route/date always looks the same
  function seededRandom(seed){
    let s = seed >>> 0;
    return function(){ s = (s * 1664525 + 1013904223) >>> 0; return (s >>> 8) / 16777216; };
  }
  function hashStr(str){ let h=0; for(const c of str) h = (h*31 + c.charCodeAt(0)) >>> 0; return h; }

  function generateBuses(from, to, date){
    const rand = seededRandom(hashStr(from+to+date));
    const basePrice = 450 + Math.floor(rand()*250);
    const count = 4 + Math.floor(rand()*3);
    const buses = [];
    for(let i=0;i<count;i++){
      const op = OPERATORS[Math.floor(rand()*OPERATORS.length)];
      const hour = 6 + Math.floor(rand()*16);
      const min = rand() < 0.5 ? "00" : "30";
      const durH = 4 + Math.floor(rand()*5);
      const ac = rand() < 0.5;
      const price = basePrice + (ac ? 150 : 0) + Math.floor(rand()*60);
      const seatsLeft = 3 + Math.floor(rand()*30);
      buses.push({
        id: i, operator: op, type: ac ? "AC Business" : "Non-AC Chair Coach",
        depart: `${String(hour).padStart(2,'0')}:${min}`,
        duration: `${durH}h ${rand()<0.5?'00':'30'}m`,
        price, seatsLeft, seed: hashStr(from+to+date+op+i)
      });
    }
    return buses.sort((a,b)=>a.depart.localeCompare(b.depart));
  }

  function generateTakenSeats(seed, totalSeats){
    const rand = seededRandom(seed);
    const taken = new Set();
    const n = 4 + Math.floor(rand()*8);
    while(taken.size < n) taken.add(1 + Math.floor(rand()*totalSeats));
    return taken;
  }

  // ---------- SCREEN NAV ----------
  const screens = ["search","results","seats","passenger","ticket"];
  function showScreen(name){
    screens.forEach(s => document.getElementById('screen-'+s).classList.toggle('hidden', s!==name));
    const labels = {search:"Search", results:"Choose bus", seats:"Choose seats", passenger:"Your details", ticket:"Ticket"};
    document.getElementById('stepIndicator').textContent = labels[name];
    window.scrollTo({top:0, behavior:'smooth'});
  }

  // ---------- STEP 1: SEARCH ----------
  const fromSel = document.getElementById('from');
  const toSel = document.getElementById('to');
  const dateInput = document.getElementById('date');
  const paxSel = document.getElementById('pax');

  const tomorrow = new Date(Date.now() + 86400000).toISOString().split('T')[0];
  dateInput.value = tomorrow;
  dateInput.min = new Date().toISOString().split('T')[0];

  document.getElementById('swapBtn').addEventListener('click', () => {
    const tmp = fromSel.value; fromSel.value = toSel.value; toSel.value = tmp;
  });

  function renderRouteList(){
    const list = document.getElementById('routeList');
    list.innerHTML = POPULAR_ROUTES.map(r =>
      `<div class="route-card" data-from="${r.from}" data-to="${r.to}">
        <b>${r.from} → ${r.to}</b><span class="price">৳${r.price}+</span>
        <div style="color:var(--muted); margin-top:4px;">${r.dur} · Daily</div>
      </div>`
    ).join('');
    list.querySelectorAll('.route-card').forEach(card=>{
      card.addEventListener('click', ()=>{
        fromSel.value = card.dataset.from;
        toSel.value = card.dataset.to;
        runSearch();
      });
    });
  }
  renderRouteList();

  function runSearch(){
    state.from = fromSel.value; state.to = toSel.value;
    state.date = dateInput.value; state.pax = Number(paxSel.value);
    if(state.from === state.to){ alert("Origin and destination can't be the same."); return; }
    state.buses = generateBuses(state.from, state.to, state.date);
    renderBusList();
    showScreen('results');
  }
  document.getElementById('searchForm').addEventListener('submit', e=>{ e.preventDefault(); runSearch(); });

  // ---------- STEP 2: RESULTS ----------
  function renderBusList(){
    document.getElementById('resultsTitle').textContent =
      `${state.from} → ${state.to} · ${formatDate(state.date)} · ${state.pax} passenger${state.pax>1?'s':''}`;
    const wrap = document.getElementById('busList');
    wrap.innerHTML = state.buses.map(b => `
      <div class="bus-card" data-id="${b.id}">
        <div>
          <div class="op">${b.operator}</div>
          <div class="meta">${b.type} · Departs ${b.depart} · ${b.duration}</div>
          <div class="seats-left">${b.seatsLeft} seats left</div>
        </div>
        <div style="text-align:right;">
          <div class="fare">৳${b.price}</div>
          <button class="btn" data-select="${b.id}" style="margin-top:8px;">Select seats</button>
        </div>
      </div>`).join('');
    wrap.querySelectorAll('[data-select]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.chosenBus = state.buses.find(b=>b.id===Number(btn.dataset.select));
        state.seats = [];
        openSeatMap();
      });
    });
  }
  document.getElementById('backToSearch').addEventListener('click', ()=>showScreen('search'));

  function formatDate(iso){
    if(!iso) return '';
    const d = new Date(iso+'T00:00:00');
    return d.toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short'});
  }

  // ---------- STEP 3: SEATS ----------
  const TOTAL_SEATS = 36;
  let takenSeats = new Set();

  function openSeatMap(){
    const b = state.chosenBus;
    document.getElementById('seatsTitle').textContent = `${b.operator} — ${b.type}`;
    document.getElementById('seatsSub').textContent =
      `${state.from} → ${state.to} · ${formatDate(state.date)} · Departs ${b.depart} · Select ${state.pax} seat${state.pax>1?'s':''}`;
    takenSeats = generateTakenSeats(b.seed, TOTAL_SEATS);
    renderSeatMap();
    renderSeatSummary();
    showScreen('seats');
  }

  function renderSeatMap(){
    const map = document.getElementById('seatMap');
    let html = '';
    const rows = TOTAL_SEATS / 4; // 4 real seats per row (2 + aisle + 2)
    for(let r=0; r<rows; r++){
      for(let c=0; c<5; c++){
        if(c === 2){ html += `<div class="seat aisle-gap"></div>`; continue; }
        const posInRow = c < 2 ? c : c - 1; // 0,1,2,3
        const n = r*4 + posInRow + 1;
        const label = String.fromCharCode(65 + r) + (posInRow + 1);
        const isTaken = takenSeats.has(n);
        const isSelected = state.seats.includes(n);
        html += `<div class="seat ${isTaken?'taken':''} ${isSelected?'selected':''}" data-seat="${n}">${label}</div>`;
      }
    }
    map.innerHTML = html;
    map.querySelectorAll('.seat:not(.aisle-gap):not(.taken)').forEach(el=>{
      el.addEventListener('click', ()=>{
        const n = Number(el.dataset.seat);
        const idx = state.seats.indexOf(n);
        if(idx > -1){ state.seats.splice(idx,1); }
        else{
          if(state.seats.length >= state.pax){
            alert(`You can select up to ${state.pax} seat${state.pax>1?'s':''}.`);
            return;
          }
          state.seats.push(n);
        }
        renderSeatMap();
        renderSeatSummary();
      });
    });
  }

  function seatLabelFromNumber(n){
    const rowIdx = Math.floor((n-1)/4);
    const posInRow = (n-1)%4;
    return String.fromCharCode(65 + rowIdx) + (posInRow + 1);
  }

  function renderSeatSummary(){
    const b = state.chosenBus;
    const total = b.price * state.seats.length;
    state.fare = total;
    document.getElementById('seatSummary').innerHTML = `
      <div class="summary-row"><span>Seats selected</span><span>${state.seats.length ? state.seats.map(seatLabelFromNumber).join(', ') : '—'}</span></div>
      <div class="summary-row"><span>Fare per seat</span><span>৳${b.price}</span></div>
      <div class="summary-row"><span>Total</span><span>৳${total}</span></div>`;
  }

  document.getElementById('backToResults').addEventListener('click', ()=>showScreen('results'));
  document.getElementById('toPassenger').addEventListener('click', ()=>{
    if(state.seats.length !== state.pax){
      alert(`Please select exactly ${state.pax} seat${state.pax>1?'s':''}.`);
      return;
    }
    showScreen('passenger');
  });

  // ---------- STEP 4: PASSENGER ----------
  document.getElementById('passengerForm').addEventListener('submit', e=>{
    e.preventDefault();
    state.passenger = {
      name: document.getElementById('pname').value.trim(),
      phone: document.getElementById('pphone').value.trim(),
      email: document.getElementById('pemail').value.trim()
    };
    renderTicket();
    showScreen('ticket');
  });
  document.getElementById('backToSeats').addEventListener('click', ()=>showScreen('seats'));

  // ---------- STEP 5: TICKET ----------
  function makePNR(){
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let s = '';
    for(let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
    return s;
  }

  function renderTicket(){
    const b = state.chosenBus;
    document.getElementById('pnrCode').textContent = 'PNR: ' + makePNR();
    document.getElementById('ticketGrid').innerHTML = `
      <div><div class="label">Route</div>${state.from} → ${state.to}</div>
      <div><div class="label">Date</div>${formatDate(state.date)}</div>
      <div><div class="label">Operator</div>${b.operator}</div>
      <div><div class="label">Departs</div>${b.depart}</div>
      <div><div class="label">Coach type</div>${b.type}</div>
      <div><div class="label">Seats</div>${state.seats.map(seatLabelFromNumber).join(', ')}</div>
      <div><div class="label">Passenger</div>${state.passenger.name}</div>
      <div><div class="label">Phone</div>${state.passenger.phone}</div>
      <div><div class="label">Total fare</div>৳${state.fare}</div>`;
  }

  document.getElementById('newBooking').addEventListener('click', ()=>{
    document.getElementById('passengerForm').reset();
    state.seats = []; state.chosenBus = null;
    showScreen('search');
  });

})();
</script>

</body>
</html>
